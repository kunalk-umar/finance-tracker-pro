<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><title>New Password — Finance Tracker Pro</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/><style>*{font-family:Inter,sans-serif;}body{background:#0d1117;color:#e6edf3;min-height:100vh;display:flex;align-items:center;justify-content:center;}.auth-card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:2.5rem;width:100%;max-width:440px;}.form-control{background:#21262d;border:1px solid #30363d;color:#e6edf3;border-radius:8px;}.form-control:focus{background:#21262d;border-color:#10b981;color:#e6edf3;box-shadow:0 0 0 3px rgba(16,185,129,.15);}.btn-accent{background:#10b981;border-color:#10b981;color:#fff;font-weight:600;width:100%;}</style></head><body><div class="container px-3"><div class="auth-card mx-auto"><h4 class="text-center fw-bold mb-4">Set New Password</h4><form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit" class="btn btn-accent mt-3">Set Password</button></form></div></div></body></html>
