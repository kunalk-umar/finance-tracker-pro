<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Password Reset — Finance Tracker Pro</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/><style>*{font-family:Inter,sans-serif;}body{background:#0d1117;color:#e6edf3;min-height:100vh;display:flex;align-items:center;justify-content:center;}.auth-card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:2.5rem;width:100%;max-width:440px;}.form-control{background:#21262d;border:1px solid #30363d;color:#e6edf3;border-radius:8px;}.form-control:focus{background:#21262d;border-color:#10b981;color:#e6edf3;box-shadow:0 0 0 3px rgba(16,185,129,.15);}.btn-accent{background:#10b981;border-color:#10b981;color:#fff;font-weight:600;width:100%;}</style></head><body><div class="container px-3"><div class="auth-card mx-auto"><a href="/" style="color:#10b981;font-size:1.3rem;font-weight:800;text-decoration:none;display:block;text-align:center;margin-bottom:1.5rem;"><i class="fa-solid fa-chart-line me-2"></i>Finance Tracker Pro</a><h4 class="text-center fw-bold mb-2">Reset Password</h4><p class="text-center text-muted small mb-4">Enter your email to receive a reset link.</p><form method="post">{% csrf_token %}<div class="mb-3"><input type="email" name="email" class="form-control" placeholder="Your email address" required/></div><button type="submit" class="btn btn-accent">Send Reset Link</button></form><p class="text-center mt-3 small" style="color:#8b949e;"><a href="/accounts/login/" style="color:#10b981;">Back to Login</a></p></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script></body></html>
